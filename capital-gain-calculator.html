<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Capital Gain Calculator with Indexation | Legotax</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:40px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#0b3c5d;
}

label{
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:4px;
}

button{
width:100%;
padding:12px;
background:#0b3c5d;
color:white;
border:none;
cursor:pointer;
font-size:16px;
border-radius:4px;
}

button:hover{
background:#174e73;
}

.result{
margin-top:20px;
font-size:18px;
background:#f2f6ff;
padding:15px;
border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

<h2>Capital Gain Calculator (With Indexation)</h2>

<label>Purchase Price (₹)</label> <input type="number" id="purchase">

<label>Sale Price (₹)</label> <input type="number" id="sale">

<label>Purchase Year</label> <select id="purchaseYear"></select>

<div id="purchaseCII"></div>

<label>Sale Year</label> <select id="saleYear"></select>

<div id="saleCII"></div>

<button onclick="calculate()">Calculate Capital Gain</button>

<div class="result" id="result"></div>

</div>

<script>

let CII = {
2001:100,
2002:105,
2003:109,
2004:113,
2005:117,
2006:122,
2007:129,
2008:137,
2009:148,
2010:167,
2011:184,
2012:200,
2013:220,
2014:240,
2015:254,
2016:264,
2017:272,
2018:280,
2019:289,
2020:301,
2021:317,
2022:331,
2023:348,
2024:363,
2025:376
};

let purchaseSelect=document.getElementById("purchaseYear");
let saleSelect=document.getElementById("saleYear");

for(let year in CII){

let option1=document.createElement("option");
option1.value=year;
option1.text=year+"-"+(parseInt(year)+1);
purchaseSelect.appendChild(option1);

let option2=document.createElement("option");
option2.value=year;
option2.text=year+"-"+(parseInt(year)+1);
saleSelect.appendChild(option2);

}

purchaseSelect.onchange=function(){

let year=this.value;

document.getElementById("purchaseCII").innerHTML=
"Purchase Year CII: <b>"+CII[year]+"</b>";

};

saleSelect.onchange=function(){

let year=this.value;

document.getElementById("saleCII").innerHTML=
"Sale Year CII: <b>"+CII[year]+"</b>";

};

function calculate(){

let purchase=parseFloat(document.getElementById("purchase").value)||0;

let sale=parseFloat(document.getElementById("sale").value)||0;

let purchaseYear=document.getElementById("purchaseYear").value;

let saleYear=document.getElementById("saleYear").value;

if(saleYear<=purchaseYear){
alert("Sale year must be greater than purchase year");
return;
}

let purchaseCII=CII[purchaseYear];

let saleCII=CII[saleYear];

let indexedCost=purchase*(saleCII/purchaseCII);

let gain=sale-indexedCost;

let tax=gain*0.20;

document.getElementById("result").innerHTML=

"<b>Purchase Price:</b> ₹"+purchase.toFixed(2)+"<br><br>"+

"<b>Indexed Cost of Acquisition:</b> ₹"+indexedCost.toFixed(2)+"<br><br>"+

"<b>Sale Price:</b> ₹"+sale.toFixed(2)+"<br><br>"+

"<b>Long Term Capital Gain:</b> ₹"+gain.toFixed(2)+"<br><br>"+

"<b>Estimated LTCG Tax (20%):</b> ₹"+tax.toFixed(2);

}

</script>

</body>
</html>
