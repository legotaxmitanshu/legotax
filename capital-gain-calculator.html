<!DOCTYPE html>
<html lang="en">
<head>

<title>Capital Gain Calculator for Property | Legotax</title>

<meta name="description" content="Calculate capital gain tax on property sale in India easily using this free calculator.">

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:600px;
margin:auto;
padding:20px;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
}

button{
background:#0b5ed7;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<!-- HEADER (same as your site) -->
<header>
<h2>Legotax Tools</h2>
</header>


<div class="container">

<h2>Capital Gain Calculator (Property)</h2>

<label>Purchase Price (₹)</label>
<input type="number" id="purchase">

<label>Sale Price (₹)</label>
<input type="number" id="sale">

<label>Improvement Cost (₹)</label>
<input type="number" id="improvement">

<button onclick="calculateGain()">Calculate Capital Gain</button>

<h3 id="result"></h3>

</div>


<script>

function calculateGain(){

let purchase = Number(document.getElementById("purchase").value);
let sale = Number(document.getElementById("sale").value);
let improvement = Number(document.getElementById("improvement").value);

let gain = sale - (purchase + improvement);

if(gain < 0){

document.getElementById("result").innerHTML =
"Capital Loss: ₹" + gain.toFixed(2);

}else{

document.getElementById("result").innerHTML =
"Capital Gain: ₹" + gain.toFixed(2);

}

}

</script>

</body>
</html>
