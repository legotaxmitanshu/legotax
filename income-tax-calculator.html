<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-516644890');
</script>

<script>
// SLAB CALCULATION
function slab(income, slabs, rates){
  let tax=0, prev=0, work="";
  for(let i=0;i<slabs.length;i++){
    if(income>slabs[i]){
      let part=(slabs[i]-prev)*rates[i];
      tax+=part;
      work+=`₹${prev.toLocaleString()} - ₹${slabs[i].toLocaleString()} @${rates[i]*100}% = ₹${Math.round(part).toLocaleString()}<br>`;
      prev=slabs[i];
    } else {
      let part=(income-prev)*rates[i];
      tax+=part;
      work+=`₹${prev.toLocaleString()} - ₹${income.toLocaleString()} @${rates[i]*100}% = ₹${Math.round(part).toLocaleString()}<br>`;
      return [tax,work];
    }
  }
  let part=(income-prev)*rates[rates.length-1];
  tax+=part;
  work+=`Above ₹${prev.toLocaleString()} @${rates[rates.length-1]*100}% = ₹${Math.round(part).toLocaleString()}<br>`;
  return [tax,work];
}

// GET INCOME TYPE
function getIncomeType(salary, business, house, otherIncome){
  let types = [];
  if(salary>0) types.push("Salary: ₹"+salary.toLocaleString());
  if(business>0) types.push("Business: ₹"+business.toLocaleString());
  if(house!==0) types.push("House Property: ₹"+house.toLocaleString());
  if(otherIncome>0) types.push("Other: ₹"+otherIncome.toLocaleString());

  if(types.length===0) return "No Income Entered";
  if(types.length===1) return types[0];
  return "Mixed Income (" + types.join(", ") + ")";
}

// CALCULATE TAX
function calculateTax(){
  let name = document.getElementById("name").value;
  let pan = document.getElementById("pan").value;
  let ay = document.getElementById("ay").value;

  let salary=+document.getElementById("salary").value||0;
  let business=+document.getElementById("business").value||0;
  let house=+document.getElementById("house").value||0;
  let otherIncome=+document.getElementById("otherIncome").value||0;
  let deductions=+document.getElementById("deductions").value||0;
  let tds=+document.getElementById("tds").value||0;
  let advance=+document.getElementById("advance").value||0;
  let grossIncome=salary+business+house+otherIncome;
  let incomeType = getIncomeType(salary,business,house,otherIncome);

  // TRACK IN GOOGLE ANALYTICS
  gtag('event','calculate_tax',{'income_type':incomeType});

  // SHOW RESULTS
  document.getElementById("clientDetails").innerHTML=`<b>Name:</b> ${name}<br>
<b>PAN:</b> ${pan}<br>
<b>Assessment Year:</b> ${ay}<br>
<b>Income Type:</b> ${incomeType}<hr>`;
  document.getElementById("gross").innerHTML="<b>Gross Income:</b> ₹ "+grossIncome.toLocaleString();

  function regime(type){
    let std=salary>0?(type==="Old"?50000:75000):0;
    let allowedDed=(type==="New")?0:deductions;
    let taxable=Math.max(0,grossIncome-(std+allowedDed));
    let slabs,rates,rebate;
    if(type==="Old"){ slabs=[250000,500000,1000000]; rates=[0,0.05,0.20,0.30]; rebate=500000;}
    else if(type==="Middle"){ slabs=[300000,700000,1000000,1200000,1500000]; rates=[0,0.05,0.10,0.15,0.20,0.30]; rebate=700000;}
    else{ slabs=[400000,800000,1200000,1600000,2000000,2400000]; rates=[0,0.05,0.10,0.15,0.20,0.25,0.30]; rebate=1200000;}
    let [tax,work]=slab(taxable,slabs,rates);
    if(taxable<=rebate) tax=0;
    let cess=tax*0.04;
    let total=Math.round(tax+cess);
    let net=total-(tds+advance);
    return {std,allowedDed,taxable,base:Math.round(tax),cess:Math.round(cess),total,net,work};
  }

  let oldR=regime("Old"), midR=regime("Middle"), newR=regime("New");
  function box(title,data){
    return `<div class="regime-title">${title} Regime</div>
<table>
<tr><td>Standard Deduction</td><td>₹ ${data.std.toLocaleString()}</td></tr>
<tr><td>Other Deductions</td><td>₹ ${data.allowedDed.toLocaleString()}</td></tr>
<tr><td>Taxable Income</td><td>₹ ${data.taxable.toLocaleString()}</td></tr>
<tr><td>Income Tax</td><td>₹ ${data.base.toLocaleString()}</td></tr>
<tr><td>Cess 4%</td><td>₹ ${data.cess.toLocaleString()}</td></tr>
<tr><td><b>Total Tax Liability</b></td><td><b>₹ ${data.total.toLocaleString()}</b></td></tr>
<tr><td>Less: TDS + Advance</td><td>₹ ${(tds+advance).toLocaleString()}</td></tr>
<tr><td><b>Net Payable / Refund</b></td><td><b>₹ ${data.net.toLocaleString()}</b></td></tr>
</table>
<div style="margin-top:8px;font-size:13px"><b>Slab Working:</b><br>${data.work}</div>`;
  }

  document.getElementById("oldBox").innerHTML=box("Old",oldR);
  document.getElementById("midBox").innerHTML=box("Middle",midR);
  document.getElementById("newBox").innerHTML=box("New",newR);

  document.getElementById("bestRegime").innerHTML="Best Tax Saving Regime: "+(Math.min(oldR.total,midR.total,newR.total)===oldR.total?"OLD":Math.min(oldR.total,midR.total,newR.total)===midR.total?"MIDDLE":"NEW");

  document.getElementById("resultBox").style.display="block";
}

// PRINT / EXCEL EVENTS
document.querySelector('.print-btn').addEventListener('click',function(){
  let salary=+document.getElementById("salary").value||0;
  let business=+document.getElementById("business").value||0;
  let house=+document.getElementById("house").value||0;
  let otherIncome=+document.getElementById("otherIncome").value||0;
  let incomeType = getIncomeType(salary,business,house,otherIncome);
  gtag('event','print_pdf',{'income_type':incomeType});
  window.print();
});

document.querySelector('.excel-btn').addEventListener('click',function(){
  let salary=+document.getElementById("salary").value||0;
  let business=+document.getElementById("business").value||0;
  let house=+document.getElementById("house").value||0;
  let otherIncome=+document.getElementById("otherIncome").value||0;
  let incomeType = getIncomeType(salary,business,house,otherIncome);
  gtag('event','export_excel',{'income_type':incomeType});
  let text=document.getElementById("printSection").innerText;
  let blob=new Blob([text],{type:"application/vnd.ms-excel"});
  let link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="Statement_of_Income.xls";
  link.click();
});
</script>
