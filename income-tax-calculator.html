<script>

// ---------- SLABS ----------
function getRegimeData(regime){

if(regime==="old"){
return {
slabs:[250000,500000,1000000],
rates:[0,0.05,0.20,0.30],
rebate:500000
};
}

if(regime==="middle"){
return {
slabs:[300000,700000,1000000,1200000,1500000],
rates:[0,0.05,0.10,0.15,0.20,0.30],
rebate:700000
};
}

return {
slabs:[400000,800000,1200000,1600000,2000000,2400000],
rates:[0,0.05,0.10,0.15,0.20,0.25,0.30],
rebate:1200000
};
}

// ---------- SLAB TAX ----------
function slabTax(income, slabs, rates){
let tax=0;
let prev=0;

for(let i=0;i<slabs.length;i++){
if(income>slabs[i]){
tax+=(slabs[i]-prev)*rates[i];
prev=slabs[i];
}else{
tax+=(income-prev)*rates[i];
return tax;
}
}

tax+=(income-prev)*rates[rates.length-1];
return tax;
}

// ---------- SURCHARGE ----------
function surcharge(income,tax){
if(income>50000000) return tax*0.37;
if(income>20000000) return tax*0.25;
if(income>10000000) return tax*0.15;
if(income>5000000) return tax*0.10;
return 0;
}

// ---------- MAIN CALCULATION ----------
function calculate(){

let regime=document.getElementById("regime").value;

let salary=+document.getElementById("salary").value||0;
let business=+document.getElementById("business").value||0;
let otherIncome=+document.getElementById("otherIncome").value||0;
let house=+document.getElementById("house").value||0;
let deductions=+document.getElementById("deductions").value||0;

let tds=+document.getElementById("tds").value||0;
let advance=+document.getElementById("advance").value||0;
let delayA=+document.getElementById("delayA").value||0;
let delayB=+document.getElementById("delayB").value||0;
let under234C=+document.getElementById("under234C").value||0;

// Standard deduction auto
if(salary>0) deductions+=50000;

// Gross Income
let gross=salary+business+otherIncome+house;

// Taxable
let taxable=Math.max(0,gross-deductions);

// Slab tax
let data=getRegimeData(regime);
let tax=slabTax(taxable,data.slabs,data.rates);

// 87A REBATE
if(taxable<=data.rebate){
tax=0;
}

// Surcharge
let sur=surcharge(taxable,tax);

// Cess
let cess=(tax+sur)*0.04;

let totalTax=tax+sur+cess;

// Interest
let interest234A= totalTax*0.01*delayA;
let interest234B= totalTax*0.01*delayB;
let interest234C= under234C*0.01*3;

let grossLiability=totalTax+interest234A+interest234B+interest234C;

// Net payable
let netPayable=grossLiability-(tds+advance);

// OUTPUT
document.getElementById("output").innerHTML=`
<table>
<tr><th>Particulars</th><th>Amount (₹)</th></tr>
<tr><td>Gross Total Income</td><td>${gross.toLocaleString()}</td></tr>
<tr><td>Less: Deductions</td><td>${deductions.toLocaleString()}</td></tr>
<tr><td><b>Total Income</b></td><td><b>${taxable.toLocaleString()}</b></td></tr>
<tr><td>Income Tax</td><td>${Math.round(tax).toLocaleString()}</td></tr>
<tr><td>Surcharge</td><td>${Math.round(sur).toLocaleString()}</td></tr>
<tr><td>Health & Education Cess 4%</td><td>${Math.round(cess).toLocaleString()}</td></tr>
<tr><td><b>Total Tax Liability</b></td><td><b>${Math.round(totalTax).toLocaleString()}</b></td></tr>
<tr><td>Interest u/s 234A</td><td>${Math.round(interest234A).toLocaleString()}</td></tr>
<tr><td>Interest u/s 234B</td><td>${Math.round(interest234B).toLocaleString()}</td></tr>
<tr><td>Interest u/s 234C</td><td>${Math.round(interest234C).toLocaleString()}</td></tr>
<tr><td><b>Gross Liability</b></td><td><b>${Math.round(grossLiability).toLocaleString()}</b></td></tr>
<tr><td>Less: TDS + Advance Tax</td><td>${(tds+advance).toLocaleString()}</td></tr>
<tr><th>Net Payable / (Refund)</th><th>${Math.round(netPayable).toLocaleString()}</th></tr>
</table>
`;
}

</script>
