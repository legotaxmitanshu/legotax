<div class="container">

<h2>Income Tax Calculator</h2>

<label>Salary Income</label>
<input id="salary" type="number">

<label>Business / Professional Income</label>
<input id="business" type="number">

<label>House Property (+/-)</label>
<input id="house" type="number">

<label>Other Income</label>
<input id="otherIncome" type="number">

<label>Deductions (80C, 80D, Loan Interest etc)</label>
<input id="deductions" type="number">

<button onclick="calculate()">Calculate Tax</button>
<button id="printBtn" class="secondary" onclick="window.print()">Print / Download PDF</button>

<div id="resultBox" class="result"></div>

<div class="contact">
<b>Need ITR Filing / Tax Planning?</b><br>
📞 8076054114<br>
📧 support@legotax.in
</div>

<script>

function slab(income, slabs, rates){
let tax=0,prev=0;
for(let i=0;i<slabs.length;i++){
if(income>slabs[i]){
tax+=(slabs[i]-prev)*rates[i];
prev=slabs[i];
}else{
tax+=(income-prev)*rates[i];
return tax;
}
}
tax+=(income-prev)*rates[rates.length-1];
return tax;
}

function regimeCalc(type, taxable){
let slabs,rates,rebate;

if(type=="old"){
slabs=[250000,500000,1000000];
rates=[0,0.05,0.20,0.30];
rebate=500000;
}
if(type=="middle"){
slabs=[300000,700000,1000000,1200000,1500000];
rates=[0,0.05,0.10,0.15,0.20,0.30];
rebate=700000;
}
if(type=="new"){
slabs=[400000,800000,1200000,1600000,2000000,2400000];
rates=[0,0.05,0.10,0.15,0.20,0.25,0.30];
rebate=1200000;
}

let tax=slab(taxable,slabs,rates);
if(taxable<=rebate) tax=0;

let surcharge=0;
if(taxable>5000000) surcharge=tax*0.10;

let cess=(tax+surcharge)*0.04;
return Math.round(tax+surcharge+cess);
}

function calculate(){

let salary=+document.getElementById("salary").value||0;
let business=+document.getElementById("business").value||0;
let house=+document.getElementById("house").value||0;
let otherIncome=+document.getElementById("otherIncome").value||0;
let deductions=+document.getElementById("deductions").value||0;

let gross=salary+business+house+otherIncome;

/* STANDARD DEDUCTION */
let oldTaxable=Math.max(0,gross-(deductions+(salary>0?50000:0)));
let midTaxable=Math.max(0,gross-(deductions+(salary>0?75000:0)));
let newTaxable=Math.max(0,gross-(salary>0?75000:0));

let oldTax=regimeCalc("old",oldTaxable);
let midTax=regimeCalc("middle",midTaxable);
let newTax=regimeCalc("new",newTaxable);

/* BEST REGIME */
let best=Math.min(oldTax,midTax,newTax);
let bestName=(best==oldTax)?"Old Regime":(best==midTax)?"Middle Regime":"New Regime";

document.getElementById("resultBox").style.display="block";
document.getElementById("printBtn").style.display="block";

document.getElementById("resultBox").innerHTML=`
<h3 style="text-align:center">Tax Comparison</h3>
<table>
<tr><th>Regime</th><th>Tax Payable (₹)</th></tr>
<tr><td>Old Regime</td><td>${oldTax.toLocaleString()}</td></tr>
<tr><td>Middle Regime</td><td>${midTax.toLocaleString()}</td></tr>
<tr><td>New Regime</td><td>${newTax.toLocaleString()}</td></tr>
</table>

<div class="best">
Best Option: ${bestName} <br>
You Save ₹ ${(Math.max(oldTax,midTax,newTax)-best).toLocaleString()}
</div>
`;
}

</script>
