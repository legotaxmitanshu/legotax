<div class="container">

<h2>Income Tax Calculator</h2>

<label>Salary Income</label>
<input id="salary" type="number">

<label>Business / Professional Income</label>
<input id="business" type="number">

<label>House Property (+/-)</label>
<input id="house" type="number">

<label>Other Income</label>
<input id="otherIncome" type="number">

<label>Other Deductions (80C, 80D etc)</label>
<input id="deductions" type="number">

<button onclick="calculateTax()">Calculate Tax</button>

<div id="resultBox" class="result-box">
<div id="printSection">

<h3 style="text-align:center;">Tax Summary</h3>

<p id="gross"></p>
<p id="std"></p>
<p id="otherDed"></p>
<p id="totalDed"></p>
<p id="taxable"></p>

<table>
<tr><th>Regime</th><th>Tax Payable (₹)</th></tr>
<tr><td>Old Regime</td><td id="oldTax"></td></tr>
<tr><td>Middle Regime</td><td id="midTax"></td></tr>
<tr><td>New Regime</td><td id="newTax"></td></tr>
</table>

<div id="bestRegime" class="summary"></div>

</div>

<script>

function slab(income, slabs, rates){
let tax=0,prev=0;
for(let i=0;i<slabs.length;i++){
if(income>slabs[i]){
tax+=(slabs[i]-prev)*rates[i];
prev=slabs[i];
}else{
tax+=(income-prev)*rates[i];
return tax;
}}
tax+=(income-prev)*rates[rates.length-1];
return tax;
}

function regimeCalc(type,taxable){
let slabs,rates,rebate;

if(type==="old"){
slabs=[250000,500000,1000000];
rates=[0,0.05,0.20,0.30];
rebate=500000;
}
else if(type==="middle"){
slabs=[300000,700000,1000000,1200000,1500000];
rates=[0,0.05,0.10,0.15,0.20,0.30];
rebate=700000;
}
else{
slabs=[400000,800000,1200000,1600000,2000000,2400000];
rates=[0,0.05,0.10,0.15,0.20,0.25,0.30];
rebate=1200000;
}

let tax=slab(taxable,slabs,rates);
if(taxable<=rebate) tax=0;
let cess=tax*0.04;
return Math.round(tax+cess);
}

function calculateTax(){

let salary=+document.getElementById("salary").value||0;
let business=+document.getElementById("business").value||0;
let house=+document.getElementById("house").value||0;
let otherIncome=+document.getElementById("otherIncome").value||0;
let deductions=+document.getElementById("deductions").value||0;

let gross=salary+business+house+otherIncome;

let standardDeduction=salary>0?75000:0;
let totalDeduction=deductions+standardDeduction;
let taxable=Math.max(0,gross-totalDeduction);

let oldTax=regimeCalc("old",taxable);
let midTax=regimeCalc("middle",taxable);
let newTax=regimeCalc("new",taxable);

document.getElementById("gross").innerHTML="Gross Income: ₹ "+gross.toLocaleString();
document.getElementById("std").innerHTML="Standard Deduction: ₹ "+standardDeduction.toLocaleString();
document.getElementById("otherDed").innerHTML="Other Deductions: ₹ "+deductions.toLocaleString();
document.getElementById("totalDed").innerHTML="Total Deductions: ₹ "+totalDeduction.toLocaleString();
document.getElementById("taxable").innerHTML="Taxable Income: ₹ "+taxable.toLocaleString();

document.getElementById("oldTax").innerHTML=oldTax.toLocaleString();
document.getElementById("midTax").innerHTML=midTax.toLocaleString();
document.getElementById("newTax").innerHTML=newTax.toLocaleString();

let min=Math.min(oldTax,midTax,newTax);
let best=min===oldTax?"Old Regime":min===midTax?"Middle Regime":"New Regime";

document.getElementById("bestRegime").innerHTML="Best Option: "+best;

document.getElementById("resultBox").style.display="block";
}

</script>
