<style>

nav{position:fixed;top:0;width:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:1000;padding:15px 0;}

<body>

<div class="container">

<h2>Professional Income Tax Computation Suite</h2>

<label>Select Regime</label>
<select id="regime">
<option value="old">Old Regime</option>
<option value="middle">Middle Regime</option>
<option value="new">New Regime</option>
</select>

<div class="grid">
<div>
<label>Salary Income</label><input id="salary" type="number">
<label>Business / Professional Income</label><input id="business" type="number">
<label>Other Income</label><input id="otherIncome" type="number">
<label>House Property (+/-)</label><input id="house" type="number">
<label>Total Deductions</label><input id="deductions" type="number">
</div>

<div>
<label>TDS Credit</label><input id="tds" type="number">
<label>Advance Tax Paid</label><input id="advance" type="number">
<label>Months Delay (for 234A)</label><input id="delayA" type="number">
<label>Months Delay Advance Tax (for 234B)</label><input id="delayB" type="number">
<label>Underpaid Advance Tax (for 234C)</label><input id="under234C" type="number">
</div>
</div>

<button onclick="calculate()">Generate Computation</button>
<button class="print-btn" onclick="window.print()">Download / Print PDF</button>

<div id="output" class="result"></div>

<div class="contact">

</div>

</div>

<script>

function computeSlab(income, slabs, rates){
let tax=0, prev=0;
for(let i=0;i<slabs.length;i++){
if(income>slabs[i]){
tax+=(slabs[i]-prev)*rates[i];
prev=slabs[i];
}else{
tax+=(income-prev)*rates[i];
return tax;
}
}
tax+=(income-prev)*rates[rates.length-1];
return tax;
}

function surchargeCalc(tax,income){
if(income>5000000 && income<=10000000) return tax*0.10;
if(income>10000000 && income<=20000000) return tax*0.15;
if(income>20000000 && income<=50000000) return tax*0.25;
if(income>50000000) return tax*0.37;
return 0;
}

function getSlabs(regime){
if(regime==="old")
return {slabs:[250000,500000,1000000],rates:[0,0.05,0.20,0.30]};
if(regime==="middle")
return {slabs:[300000,700000,1000000,1200000,1500000],rates:[0,0.05,0.10,0.15,0.20,0.30]};
return {slabs:[400000,800000,1200000,1600000,2000000,2400000],rates:[0,0.05,0.10,0.15,0.20,0.25,0.30]};
}

function calculate(){

let regime=document.getElementById("regime").value;

let salary=+document.getElementById("salary").value||0;
let business=+document.getElementById("business").value||0;
let otherIncome=+document.getElementById("otherIncome").value||0;
let house=+document.getElementById("house").value||0;
let deductions=+document.getElementById("deductions").value||0;

let tds=+document.getElementById("tds").value||0;
let advance=+document.getElementById("advance").value||0;
let delayA=+document.getElementById("delayA").value||0;
let delayB=+document.getElementById("delayB").value||0;
let under234C=+document.getElementById("under234C").value||0;

let gross=salary+business+otherIncome+house;
let taxable=Math.max(0,gross-deductions);

let slabData=getSlabs(regime);
let tax=computeSlab(taxable,slabData.slabs,slabData.rates);
let surcharge=surchargeCalc(tax,taxable);
let cess=(tax+surcharge)*0.04;
let totalTax=tax+surcharge+cess;

let interest234A= totalTax * 0.01 * delayA;
let interest234B= totalTax * 0.01 * delayB;
let interest234C= under234C * 0.01 * 3;

let grossLiability=totalTax+interest234A+interest234B+interest234C;

let netPayable=grossLiability-(tds+advance);

document.getElementById("output").innerHTML=`
<table>
<tr><th>Particulars</th><th>Amount (₹)</th></tr>
<tr><td>Gross Income</td><td>${gross.toLocaleString()}</td></tr>
<tr><td>Taxable Income</td><td>${taxable.toLocaleString()}</td></tr>
<tr><td>Income Tax</td><td>${Math.round(tax).toLocaleString()}</td></tr>
<tr><td>Surcharge</td><td>${Math.round(surcharge).toLocaleString()}</td></tr>
<tr><td>Cess (4%)</td><td>${Math.round(cess).toLocaleString()}</td></tr>
<tr><td><b>Total Tax</b></td><td><b>${Math.round(totalTax).toLocaleString()}</b></td></tr>
<tr><td>Interest 234A</td><td>${Math.round(interest234A).toLocaleString()}</td></tr>
<tr><td>Interest 234B</td><td>${Math.round(interest234B).toLocaleString()}</td></tr>
<tr><td>Interest 234C</td><td>${Math.round(interest234C).toLocaleString()}</td></tr>
<tr><td><b>Gross Liability</b></td><td><b>${Math.round(grossLiability).toLocaleString()}</b></td></tr>
<tr><td>TDS + Advance Tax</td><td>${(tds+advance).toLocaleString()}</td></tr>
<tr><th>Net Payable / (Refund)</th><th>${Math.round(netPayable).toLocaleString()}</th></tr>
</table>
`;
}

</script>

</body>
