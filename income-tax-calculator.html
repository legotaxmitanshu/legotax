<script>

function slabOld(t){
let tax=0;
if(t>250000) tax+=(Math.min(t,500000)-250000)*0.05;
if(t>500000) tax+=(Math.min(t,1000000)-500000)*0.20;
if(t>1000000) tax+=(t-1000000)*0.30;
if(t<=500000) tax=0;
return tax;
}

function slabNew(t){
let tax=0;
let slabs=[400000,800000,1200000,1600000,2000000,2400000];
let rates=[0,0.05,0.10,0.15,0.20,0.25,0.30];

let prev=0;
for(let i=0;i<slabs.length;i++){
if(t>slabs[i]){
tax+=(slabs[i]-prev)*rates[i];
prev=slabs[i];
}else{
tax+=(t-prev)*rates[i];
return (t<=1200000)?0:tax;
}
}
tax+=(t-prev)*0.30;
return tax;
}

function surcharge(tax,income){
let s=0;
if(income>5000000 && income<=10000000) s=tax*0.10;
else if(income>10000000 && income<=20000000) s=tax*0.15;
else if(income>20000000 && income<=50000000) s=tax*0.25;
else if(income>50000000) s=tax*0.37;
return s;
}

function calculate(){

let salary=Number(document.getElementById("salary").value)||0;
let business=Number(document.getElementById("business").value)||0;
let otherIncome=Number(document.getElementById("otherIncome").value)||0;
let house=Number(document.getElementById("house").value)||0;

let gross=salary+business+otherIncome+house;

let d80c=Number(document.getElementById("d80c").value)||0;
let d80d=Number(document.getElementById("d80d").value)||0;
let home=Number(document.getElementById("home").value)||0;
let edu=Number(document.getElementById("edu").value)||0;
let other=Number(document.getElementById("other").value)||0;

let deductions=d80c+d80d+home+edu+other;

let taxableOld=Math.max(0,gross-deductions-50000);
let taxOld=slabOld(taxableOld);
let surchargeOld=surcharge(taxOld,taxableOld);
let cessOld=(taxOld+surchargeOld)*0.04;
let totalOld=taxOld+surchargeOld+cessOld;

let taxableNew=Math.max(0,gross-50000);
let taxNew=slabNew(taxableNew);
let surchargeNew=surcharge(taxNew,taxableNew);
let cessNew=(taxNew+surchargeNew)*0.04;
let totalNew=taxNew+surchargeNew+cessNew;

document.getElementById("output").innerHTML=`
<h3>Computation Summary</h3>

<table>
<tr><th>Particulars</th><th>Old Regime</th><th>New Regime</th></tr>
<tr><td>Gross Income</td><td>${gross.toLocaleString()}</td><td>${gross.toLocaleString()}</td></tr>
<tr><td>Taxable Income</td><td>${taxableOld.toLocaleString()}</td><td>${taxableNew.toLocaleString()}</td></tr>
<tr><td>Income Tax</td><td>${Math.round(taxOld).toLocaleString()}</td><td>${Math.round(taxNew).toLocaleString()}</td></tr>
<tr><td>Surcharge</td><td>${Math.round(surchargeOld).toLocaleString()}</td><td>${Math.round(surchargeNew).toLocaleString()}</td></tr>
<tr><td>Health & Education Cess (4%)</td><td>${Math.round(cessOld).toLocaleString()}</td><td>${Math.round(cessNew).toLocaleString()}</td></tr>
<tr><th>Total Tax Payable</th><th>${Math.round(totalOld).toLocaleString()}</th><th>${Math.round(totalNew).toLocaleString()}</th></tr>
</table>
`;

}
</script>
