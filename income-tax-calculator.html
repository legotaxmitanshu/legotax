<body>

<div class="container">

<h1>Income Tax Calculator (FY 2025-26)</h1>

<h3>Income Details</h3>

<label>Annual Income (₹)</label> <input type="number" id="income" placeholder="Enter total income">

<label>HRA Exemption (₹)</label> <input type="number" id="hra" placeholder="Optional">

<label>Standard Deduction (₹50,000 for salary)</label> <input type="number" id="standard" placeholder="Example: 50000">

<h3>Deductions (Old Regime Only)</h3>

<label>80C (PF, LIC, ELSS etc)</label> <input type="number" id="d80c">

<label>80D Medical Insurance</label> <input type="number" id="d80d">

<label>Home Loan Interest (Section 24)</label> <input type="number" id="home">

<label>Education Loan Interest (80E)</label> <input type="number" id="edu">

<label>Other deductions (80G, 80TTA etc)</label> <input type="number" id="other">

<button onclick="calculateTax()">Calculate Tax & Compare</button>

<div class="result" id="result">
Enter details and press Calculate
</div>

<div class="better" id="better"></div>

<script>

// OLD REGIME
function oldRegimeTax(taxable){
let tax=0;

if(taxable<=250000) tax=0;
else if(taxable<=500000) tax=(taxable-250000)*0.05;
else if(taxable<=1000000) tax=12500+(taxable-500000)*0.20;
else tax=112500+(taxable-1000000)*0.30;

if(taxable<=500000) tax=0;

return tax;
}

// NEW REGIME FY 2025-26
function newRegimeTax(income){
let tax=0;

if(income<=400000) tax=0;
else if(income<=800000) tax=(income-400000)*0.05;
else if(income<=1200000) tax=20000+(income-800000)*0.10;
else if(income<=1600000) tax=60000+(income-1200000)*0.15;
else if(income<=2000000) tax=120000+(income-1600000)*0.20;
else if(income<=2400000) tax=200000+(income-2000000)*0.25;
else tax=300000+(income-2400000)*0.30;

// 87A rebate upto 12 lakh
if(income<=1200000) tax=0;

return tax;
}

function calculateTax(){

let income=Number(document.getElementById("income").value)||0;
let hra=Number(document.getElementById("hra").value)||0;
let standard=Number(document.getElementById("standard").value)||0;

let d80c=Number(document.getElementById("d80c").value)||0;
let d80d=Number(document.getElementById("d80d").value)||0;
let home=Number(document.getElementById("home").value)||0;
let edu=Number(document.getElementById("edu").value)||0;
let other=Number(document.getElementById("other").value)||0;

let totalDeduction=hra+standard+d80c+d80d+home+edu+other;
let oldTaxable=income-totalDeduction;
if(oldTaxable<0) oldTaxable=0;

let oldTax=oldRegimeTax(oldTaxable);

let newTaxable=income-standard;
if(newTaxable<0) newTaxable=0;

let newTax=newRegimeTax(newTaxable);

document.getElementById("result").innerHTML=
"<b>Old Regime Tax:</b> ₹"+oldTax.toLocaleString()+
"<br><b>New Regime Tax:</b> ₹"+newTax.toLocaleString();

let better="";
if(oldTax<newTax)
better="Old Regime is Better. You save ₹"+(newTax-oldTax).toLocaleString();
else if(newTax<oldTax)
better="New Regime is Better. You save ₹"+(oldTax-newTax).toLocaleString();
else
better="Both regimes give same tax.";

document.getElementById("better").innerHTML=better;

}

</script>
